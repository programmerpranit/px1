<!doctype html>
<html lang="en" data-theme="github-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>px1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23e8823c'/%3E%3Ctext x='12' y='17' font-family='monospace' font-weight='700' font-size='13' text-anchor='middle' fill='%23161616'%3Ep1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<!-- Every web/themes/*.css joined by the server. See docs/internals/styling-and-themes.md. -->
<link rel="stylesheet" href="/static/themes.css">
</head>
<body class="right-hidden">
<div id="app">
  <!-- SECTION: Sidebar (File explorer tree) -->
  <aside id="side">
    <header class="panel-head">
      <span id="root-name">-</span>
      <span class="panel-actions"><button id="btn-changed" class="mini" title="Show changed files only" hidden><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7M18 11.5c0 3-3 3.5-6 3.5"/></svg></button><button id="btn-reindex" class="mini" title="Re-index"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button></span>
    </header>
    <div class="side-tabs">
      <button class="side-tab active" id="side-tab-files" data-side="files" title="Files">Files</button>
      <button class="side-tab" id="side-tab-scm" data-side="scm" title="Source Control">Source Control<span id="scm-badge" class="scm-badge" hidden>0</span></button>
    </div>
    <div class="panel-body" id="tree"></div>
    <div class="panel-body" id="scm" hidden>
      <div id="scm-commit">
        <textarea id="scm-message" rows="2" spellcheck="false" placeholder="Commit message"></textarea>
        <div id="scm-commit-actions">
          <button id="scm-generate" class="mini" title="Generate a commit message from staged changes">Generate</button>
          <button id="scm-commit-btn" title="Commit staged changes">Commit</button>
        </div>
        <div id="scm-err" class="scm-err" hidden></div>
      </div>
      <div id="scm-sync" class="scm-sync" hidden>
        <span id="scm-sync-text"></span>
        <button id="scm-push-btn" class="mini" title="Push to remote">Push</button>
      </div>
      <div id="scm-groups"></div>
    </div>
    <footer class="side-foot">
      <a class="side-logo" href="https://github.com/programmerpranit/px1" target="_blank" rel="noopener" title="px1">px1</a>
      <span id="st-ver" class="status-ver" title="px1 Version"></span>
      <span class="side-actions">
      <a class="mini" href="https://github.com/programmerpranit/px1" target="_blank" rel="noopener" title="px1 on GitHub" aria-label="px1 on GitHub">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <button class="mini" id="btn-theme" title="Cycle theme (pick one: Command Palette > Select Theme)" aria-label="Cycle theme">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1" fill="currentColor"/><circle cx="17.5" cy="10.5" r="1" fill="currentColor"/><circle cx="8.5" cy="7.5" r="1" fill="currentColor"/><circle cx="6.5" cy="12.5" r="1" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
      </button>
      </span>
    </footer>
  </aside>

  <!-- Sidebar Resizer Divider -->
  <div id="resizer"></div>

  <!-- SECTION: Main Editor Area -->
  <main id="main">
    <!-- File Tabs -->
    <div id="tabs"></div>
    <!-- View-mode switches, pinned to the right of the tab bar -->
    <div id="view-switches">
      <!-- Modified files in a git repo only: view the file's diff against HEAD -->
      <div id="diff-switch" class="view-switch" role="group" aria-label="Diff view" hidden>
        <button id="diff-source" data-diff-opt="source" title="Show the file ({Mod+D})">Source</button>
        <button id="diff-btn" title="Show changes against HEAD ({Mod+D})">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="diff-btn-icon"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7M18 11.5c0 3-3 3.5-6 3.5"/></svg>
          <span class="diff-btn-label">Diff</span>
        </button>
      </div>
    </div>

    <!-- Virtualized Code Editor Viewport -->
    <div id="editor">
      <!-- #viewport handles scrolling; #sizer sets full document scroll height; #rows renders only visible DOM rows.
           Editable in place once eligible (small_scope) -- click in and type, no separate mode. -->
      <div id="viewport">
        <div id="sizer"><div id="rows"></div><div id="caret" hidden></div></div>
      </div>
      <!-- Save-conflict banner: shown over the code view when a save collides with a disk change -->
      <div id="edit-banner" hidden></div>
      <!-- Diff view: covers the code view while a diff layout is active (Mod+D toggles) -->
      <div id="diffview" hidden><div id="diffcontent"></div></div>
      <!-- Image viewer: covers the code view for an image tab (plain, no zoom/pan) -->
      <div id="imgview" hidden>
        <div id="imgview-canvas" class="bg-checker">
          <img id="imgview-img" src="" alt="">
        </div>
      </div>
      <div id="minimap-hits"></div>

      <!-- Welcome / Empty State Screen -->
      <div id="empty">
        <div class="empty-inner">
          <div class="empty-logo">
            <span class="empty-wordmark">px1</span>
            <span id="empty-ver"></span>
          </div>
          <dl>
            <dt data-caps="Mod+K"></dt><dd>quick search / palette</dd>
            <dt data-caps="Mod+P"></dt><dd>go to file</dd>
            <dt data-caps="Mod+Shift+F"></dt><dd>search everywhere</dd>
            <dt data-caps="Mod+F"></dt><dd>find in file</dd>
            <dt data-caps="Mod+G"></dt><dd>go to line</dd>
            <dt data-caps="Mod+D"></dt><dd>diff against HEAD</dd>
            <dt data-caps="?"></dt><dd>all shortcuts</dd>
          </dl>
        </div>
      </div>

      <!-- Find in File (Ctrl+F) Overlay Bar -->
      <div id="findbar" hidden>
        <input id="find-input" type="text" spellcheck="false" placeholder="Find" autocomplete="off">
        <span id="find-count">0</span>
        <button id="find-prev" title="Previous ({Shift+Enter})">&#8593;</button>
        <button id="find-next" title="Next ({Enter})">&#8595;</button>
        <button id="find-close" title="Close ({Esc})">&#10005;</button>
      </div>

    </div>

    <!-- Floating Copy Toast Notification -->
    <div id="toast" hidden></div>

    <!-- Selection context menu: the footer's selection actions, at the pointer -->
    <div id="sel-menu" role="menu" hidden></div>

    <!-- File tree right-click menu: Rename -->
    <div id="tree-menu" role="menu" hidden></div>

    <!-- Bottom Status Bar -->
    <footer id="status">
      <!-- Selection actions: replace the buttons and size below while code is selected -->
      <div id="footer-sel">
        <span class="sel-chip">Selection</span>
        <button class="footer-btn" data-sel="copy-ref" title="Copy file and line reference ({Alt+C})"><span class="footer-btn-label">Copy Ref</span><kbd class="footer-kbd" data-keys="Alt+C"></kbd></button>
        <button class="footer-btn" data-sel="copy-agent" title="Copy snippet with file path and line numbers ({Alt+A})"><span class="footer-btn-label">Copy with Context</span><kbd class="footer-kbd" data-keys="Alt+A"></kbd></button>
      </div>
      <div id="footer-actions">
        <button class="footer-btn" data-action="quick-open" title="Go to File ({Mod+P})"><span class="footer-btn-label">Files</span><kbd class="footer-kbd" data-keys="Mod+P"></kbd></button>
        <button class="footer-btn" data-action="search" title="Search in Files ({Mod+Shift+F})"><span class="footer-btn-label">Search</span><kbd class="footer-kbd" data-keys="Mod+Shift+F"></kbd></button>
        <button class="footer-btn" data-action="find" title="Find in File ({Mod+F})"><span class="footer-btn-label">Find in File</span><kbd class="footer-kbd" data-keys="Mod+F"></kbd></button>
        <button class="footer-btn" data-action="goto" title="Go to Line ({Mod+G})"><span class="footer-btn-label">Go to</span><kbd class="footer-kbd" data-keys="Mod+G"></kbd></button>
        <button class="footer-btn" data-action="wrap" title="Toggle Word Wrap ({Alt+Z})"><span class="footer-btn-label">Wrap</span><kbd class="footer-kbd" data-keys="Alt+Z"></kbd></button>
        <button class="footer-btn" data-action="help" title="Keyboard Shortcuts ({?})"><span class="footer-btn-label">Help</span><kbd class="footer-kbd" data-keys="?"></kbd></button>
      </div>
      <span class="status-sep"></span>
      <span id="st-size"></span>
      <span id="st-pos"></span>
      <span class="grow"></span>
      <span id="sel-stats"></span>
    </footer>
  </main>

  <!-- Right Inspector Resizer Divider -->
  <div id="right-resizer" title="Drag to resize inspector"></div>

  <!-- SECTION: Right-side panel (workspace text search) -->
  <aside id="right-side">
    <header class="inspector-head">
      <div class="inspector-tabs">
        <span class="inspector-tab active">Search</span>
      </div>
      <div class="inspector-head-actions">
        <button id="btn-close-right" class="mini" title="Close (Esc)">&#10005;</button>
      </div>
    </header>

    <section class="inspector-pane active" id="pane-right-search">
      <div class="search-form">
        <input id="q" type="text" spellcheck="false" placeholder="Search in files" autocomplete="off">
        <div class="opts">
          <button class="opt" id="o-case" title="Match case">Aa</button>
          <button class="opt" id="o-word" title="Whole word">|ab|</button>
          <button class="opt" id="o-re" title="Regular expression">.*</button>
        </div>
        <input id="glob" type="text" spellcheck="false" placeholder="files to include e.g. *.go" autocomplete="off">
      </div>
      <div class="panel-body" id="results">
        <div class="hint">Search text across every indexed file.</div>
      </div>
    </section>
  </aside>
</div>

<!-- SECTION: Command / File / Symbol Palette Modal (Cmd+K / Ctrl+P) -->
<div id="overlay" hidden>
  <div id="palette">
    <div class="pal-input"><span id="pal-mode"></span><input id="pal" type="text" spellcheck="false" autocomplete="off"></div>
    <div id="pal-list"></div>
    <div id="pal-hint"></div>
  </div>
</div>

<!-- SECTION: Keyboard Shortcuts Cheat Sheet Overlay (?) -->
<div id="helpsheet" hidden></div>


<!-- Invisible text node to measure font metrics in DOM -->
<span id="measure">0</span>

<script src="/static/app.js"></script>
</body>
</html>
